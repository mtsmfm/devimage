# Run with: docker compose up
#
# Defaults assume an NVIDIA GPU (`gpus: all`). For a CPU-only host: drop the
# `gpus: all` line. Selkies' pixelflux pipeline auto-uses HW encoding when a
# GPU is present and falls back to CPU otherwise; set SELKIES_USE_CPU=true to
# force CPU encoding explicitly.

services:
  throttle:
    image: mitmproxy/mitmproxy:latest
    container_name: devimage-throttle
    command: >
      mitmdump
      --mode regular
      --listen-host 0.0.0.0
      --listen-port 8080
      --set stream_large_bodies=1m
      -s /opt/throttle.py
    volumes:
      - ./proxy/throttle.py:/opt/throttle.py:ro
      - mitm-ca:/home/mitmproxy/.mitmproxy
    networks:
      egress:
        priority: 1
      isolated: {}
    restart: unless-stopped
    dns:
      - 9.9.9.9
      - 149.112.112.112
    healthcheck:
      test: ["CMD", "test", "-f", "/home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem"]
      interval: 1s
      timeout: 1s
      retries: 60

  ingress:
    image: haproxy:lts-alpine
    container_name: devimage-ingress
    volumes:
      - ./proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [isolated, ingress]
    ports:
      - "8080:8080"
      - "18000-18009:18000-18009"
    depends_on:
      - devimage
    restart: unless-stopped

  devimage:
    image: ghcr.io/mtsmfm/devimage:latest
    container_name: devimage
    networks: [isolated]
    depends_on:
      throttle:
        condition: service_healthy
    environment:
      # LSIO baseimage convention: omit PASSWORD to disable HTTP basic auth.
      CUSTOM_USER: "ubuntu"
      PASSWORD: "${DEVIMAGE_PASSWORD:-changeme}"
      # Match abc's runtime UID/GID to the typical host user so bind-mounted
      # /workspace files have sensible ownership.
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"
      # DEVIMAGE_ENABLE_GUI: "true"   # start Xvfb/openbox/Selkies at boot
      # On WSL2: route OpenGL through Mesa's d3d12 driver so Blender's
      # viewport (and other GL apps) reach the Windows GPU instead of falling
      # back to llvmpipe. Pair with the /usr/lib/wsl mount below. See README.
      # LD_LIBRARY_PATH: "/usr/lib/wsl/lib"
      # GALLIUM_DRIVER: "d3d12"
      # MESA_D3D12_DEFAULT_ADAPTER_NAME: "NVIDIA"
    volumes:
      - "${PWD}/workspace:/workspace"
      - mitm-ca:/mnt/mitm-ca:ro
      # HOME inside the container is /config (LSIO convention), so agent
      # credentials land under /config/.<tool>.
      - "${HOME}/.claude:/config/.claude"
      - "${HOME}/.claude.json:/config/.claude.json"
      - "${HOME}/.codex:/config/.codex"
      # On WSL2: ships libdxcore / libd3d12 / libd3d12core to the container
      # so Mesa's d3d12 driver can talk to the WDDM GPU. See env block above.
      # - "/usr/lib/wsl:/usr/lib/wsl:ro"
    # Xvfb framebuffer + X SHM extension; default /dev/shm (64MB) is too small.
    shm_size: "1gb"
    # NVIDIA GPU passthrough; drop this line for CPU-only.
    gpus: all

networks:
  egress: {}
  ingress: {}
  isolated:
    internal: true

volumes:
  mitm-ca:
